services:
  api:
    build:
      context: .
      dockerfile: docker/api.local.Dockerfile
    environment:
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
