random_seed: 42
split:
  train: 0.60
  validation: 0.20
  test: 0.20
selection_metric: f1
default_threshold: 0.50
models:
  logistic_regression:
    class_weight: balanced
    max_iter: 1000
  random_forest:
    class_weight: balanced
    n_estimators: 300
    min_samples_leaf: 2
  dummy:
    strategy: prior
