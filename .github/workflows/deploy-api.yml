name: Deploy API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "712986489191"
      - run: uv sync --all-groups --locked
      - run: uv run dvc pull models/champion.joblib.dvc
      - run: uv run pytest -q tests/integration/test_model_smoke.py tests/integration/api
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'online-shoppers-ml-api' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
            echo "Reusing existing immutable image $IMAGE_TAG"
          else
            docker buildx build --platform linux/amd64 --provenance=false \
              -f docker/api.Dockerfile \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              --push .
            DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' --output text)
          fi
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
        id: image
      - name: Terraform apply service
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_owner: ${{ vars.OWNER }}
          TF_VAR_image_uri: ${{ steps.image.outputs.image_uri }}
          TF_VAR_allowed_origin: ${{ vars.ALLOWED_ORIGIN }}
          TF_VAR_lambda_execution_role_arn: ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          terraform -chdir=infra/terraform/service init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=online-shoppers/dev/service.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform -chdir=infra/terraform/service apply -auto-approve
      - name: Smoke test
        run: |
          API_URL=$(terraform -chdir=infra/terraform/service output -raw api_base_url)
          curl --fail --retry 5 --retry-delay 5 \
            --output "$RUNNER_TEMP/health.json" "$API_URL/health"
          python -c 'import json, os, pathlib; payload = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("health.json").read_text()); assert payload.get("status") == "ok", payload'
