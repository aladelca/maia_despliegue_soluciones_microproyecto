[project]
name = "online-shoppers-ml"
version = "0.1.0"
description = "Purchase-intention model, FastAPI inference service, and supporting notebooks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "joblib>=1.5,<2",
  "mangum>=0.19,<1",
  "pandas>=2.3,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.7,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "catboost>=1.2.10",
  "dvc-s3>=3,<4",
  "httpx>=0.28,<1",
  "ipykernel>=6,<8",
  "lightgbm>=4.7.0",
  "matplotlib>=3.10,<4",
  "mlflow>=3,<4",
  "mypy>=1.17,<2",
  "nbconvert>=7.16,<8",
  "pandas-stubs>=2.3,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "seaborn>=0.13,<1",
  "types-pyyaml>=6,<7",
  "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/online_shoppers"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["online_shoppers"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "mlflow.*", "mangum.*"]
ignore_missing_imports = true
